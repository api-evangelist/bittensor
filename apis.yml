aid: bittensor
name: Bittensor
description: >-
  Bittensor is an open, decentralized machine-intelligence network built on a
  Substrate blockchain (subtensor). Contributors earn the TAO token by supplying
  useful work to specialized subnets — miners produce, validators score, and
  stakers back them — with emissions distributed by Yuma Consensus. Developers do
  not consume a hosted REST API; they interact with the chain through the official
  lean Python SDK (import bittensor) and the btcli command line, which together
  perform every user-facing operation: wallets and keys, staking and pools, subnet
  creation, mining, validating, weights, proxies, multisig, and an EVM layer. The
  developer surface is agent-native: machine-readable catalogs of write intents,
  chain reads, and errors are published for discovery, with a plan/execute model,
  Policy guardrails, and typed results.
