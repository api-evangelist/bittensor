  docs_url: https://www.bittensor.com/docs/errors/rate-limited
- code: not_registered
  remediation: register the hotkey on this subnet first with `btcli subnets register`
  docs_url: https://www.bittensor.com/docs/errors/not-registered
- code: not_authorized
  remediation: sign with the key or origin that owns the target object, then retry
  docs_url: https://www.bittensor.com/docs/errors/not-authorized
- code: already_exists
  remediation: the object or state already exists; treat the goal as met or pick a different target
  docs_url: https://www.bittensor.com/docs/errors/already-exists
- code: not_found
  remediation: the referenced object is not on-chain; check the identifier
  docs_url: https://www.bittensor.com/docs/errors/not-found
- code: subnet_not_exists
  remediation: use an existing netuid; `btcli subnets list` shows valid ones
  docs_url: https://www.bittensor.com/docs/errors/subnet-not-exists
- code: subtoken_disabled
  remediation: the subnet is not active yet; wait for start_call
  docs_url: https://www.bittensor.com/docs/errors/subtoken-disabled
- code: disabled
  remediation: this call or feature is switched off on this network
  docs_url: https://www.bittensor.com/docs/errors/disabled
- code: too_early
  remediation: the required window has not opened yet; wait some blocks and retry
  docs_url: https://www.bittensor.com/docs/errors/too-early
- code: expired
  remediation: the window has closed; restart the flow with fresh state
  docs_url: https://www.bittensor.com/docs/errors/expired
- code: limit_exceeded
  remediation: a chain-side capacity limit was hit; reduce the size or count of the request
  docs_url: https://www.bittensor.com/docs/errors/limit-exceeded
- code: unit_mismatch
  remediation: match the Balance netuid to the operation's currency
  docs_url: https://www.bittensor.com/docs/errors/unit-mismatch
- code: invalid_argument
  remediation: check the argument values against the operation schema
  docs_url: https://www.bittensor.com/docs/errors/invalid-argument
- code: policy_violation
  remediation: the action exceeds a configured safety policy
  docs_url: https://www.bittensor.com/docs/errors/policy-violation
- code: internal
  remediation: a chain-side invariant failed; nothing to fix client-side — report it if it persists
  docs_url: https://www.bittensor.com/docs/errors/internal
- code: unknown
  remediation: inspect the message for details
  docs_url: https://www.bittensor.com/docs/errors/unknown
