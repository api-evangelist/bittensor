entities:
- name: Subnet
  aka: netuid
  description: A specialized market/network identified by netuid; hosts miners and validators.
- name: Neuron
  aka: UID
  description: A registered participant slot (miner or validator) on a subnet, addressed by UID.
  belongs_to: Subnet
