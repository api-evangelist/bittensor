- name: Coldkey
  description: Root wallet key that custodies funds and authorizes high-value operations.
- name: Hotkey
  description: Operational key registered on subnets to mine/validate and sign requests.
  belongs_to: Coldkey
  via: coldkey
- name: Stake
  description: TAO/alpha backing a hotkey on a subnet via the per-subnet balancer pool.
  belongs_to: Hotkey
  via: hotkey
- name: Balance
  description: TAO or per-subnet alpha holdings of an account (rao is the base unit).
- name: Delegate
  description: A validator hotkey that stakers can back; earns take on delegated stake.
  belongs_to: Hotkey
  via: hotkey
- name: Weights
  description: Validator-set scores over miner UIDs, committed/revealed per epoch.
  belongs_to: Neuron
  via: uid
- name: Hyperparameter
  description: Owner-settable per-subnet configuration value.
  belongs_to: Subnet
  via: netuid
- name: Proxy
  description: A scoped, revocable delegate key authorized to sign calls for an account.
  belongs_to: Coldkey
  via: delegator
- name: Crowdloan/Lease
  description: Pooled contribution + lease mechanism for subnet funding/ownership.
- name: Commitment/Identity
  description: On-chain identity/commitment records bound to a hotkey or subnet.
